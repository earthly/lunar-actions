name: GitHub Actions CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the local Lunar CLI fixture
        run: echo "$GITHUB_WORKSPACE/tests/sync-config/bin" >> "$GITHUB_PATH"
      - name: Exercise sync-config
        uses: ./sync-config
        with:
          manifest-url: github://example/config/lunar-config.test.yml@main
          hub-token: test-token
          hub-host: hub.example.invalid
          lunar-version: v1.1.2
          lunar-binary-path: ${{ runner.temp }}/lunar
      - name: Verify the action invoked the CLI
        run: test -f "$RUNNER_TEMP/sync-config-passed"
